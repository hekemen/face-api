# Default values for face-api.
# This is a YAML-formatted file. Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: ghcr.io/hekemen/face-api
  pullPolicy: IfNotPresent
  tag: "dev"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 8081

ingress:
  enabled: false
  className: ""
  annotations: {}
  # When set, a Traefik Middleware strips this prefix (e.g. "/face")
  # from incoming requests before reaching the service.
  stripPrefix: ""
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# A single replica writes faces.db; the PersistentVolume is ReadWriteOnce.
persistence:
  enabled: true
  existingClaim: ""
  storageClassName: ""
  accessMode: ReadWriteOnce
  size: 1Gi

# Extra environment variables passed to the container, e.g.
# extraEnv:
#   - name: RTSP_URL
#     value: "rtsp://..."
extraEnv:
  - name: ENABLE_UI
    value: "true"
  - name: MQTT_BROKER_URL
    value: ""
  - name: MQTT_USERNAME
    value: ""
  - name: MQTT_PASSWORD
    value: ""
  - name: MQTT_CLIENT_ID
    value: "face-api"
  - name: MQTT_BASE_TOPIC
    value: "face/scan"
  - name: MQTT_DEVICE_NAME
    value: "Face API"
  - name: MQTT_QUEUE_DEPTH
    value: "16"

# Kubernetes liveness/readiness probes. Both hit lightweight HTTP endpoints
# (/healthz returns 200 whenever the process is alive; /readyz returns 200 only
# once the bbolt database is open and the cache is hydrated).
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 3

resources:
  # 1 CPU / 512Mi hard limits; ONNX inference is single-threaded.
  limits:
    cpu: "1"
    memory: "512Mi"
  requests:
    cpu: "100m"
    memory: "128Mi"

nodeSelector:
  kubernetes.io/arch: arm64

tolerations: []

affinity: {}