{{template "head" .}}
<div class="container">
  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">

      <div style="font-size: 2rem; margin-bottom: 0.5rem;">📷</div>
      <div style="font-weight: 600;">Enroll Face</div>
    </a>

      <div style="font-size: 2rem; margin-bottom: 0.5rem;">🔍</div>
      <div style="font-weight: 600;">Recognize</div>
    </a>
    <a href="stream-check" style="display: block; background: var(--pico-card-background-color); padding: 1.5rem; border-radius: 8px; text-align: center; text-decoration: none; color: inherit; border: 1px solid var(--pico-muted-border-color); transition: border-color 0.2s;" onmouseover="this.style.borderColor='var(--pico-primary)'" onmouseout="this.style.borderColor='var(--pico-muted-border-color)'">
      <div style="font-size: 2rem; margin-bottom: 0.5rem;">📡</div>
      <div style="font-weight: 600;">Stream Check</div>

    <a href="enroll" style="display: block; background: var(--pico-card-background-color); padding: 1.5rem; border-radius: 8px; text-align: center; text-decoration: none; color: inherit; border: 1px solid var(--pico-muted-border-color); transition: border-color 0.2s;" onmouseover="this.style.borderColor='var(--pico-primary)'" onmouseout="this.style.borderColor='var(--pico-muted-border-color)'">

    <a href="stats" style="display: block; background: var(--pico-card-background-color); padding: 1.5rem; border-radius: 8px; text-align: center; text-decoration: none; color: inherit; border: 1px solid var(--pico-muted-border-color); transition: border-color 0.2s;" onmouseover="this.style.borderColor='var(--pico-primary)'" onmouseout="this.style.borderColor='var(--pico-muted-border-color)'">

      <div style="font-weight: 600;">Statistics</div>

    <a href="audit" style="display: block; background: var(--pico-card-background-color); padding: 1.5rem; border-radius: 8px; text-align: center; text-decoration: none; color: inherit; border: 1px solid var(--pico-muted-border-color); transition: border-color 0.2s;" onmouseover="this.style.borderColor='var(--pico-primary)'" onmouseout="this.style.borderColor='var(--pico-muted-border-color)'">
      <div style="font-size: 2rem; margin-bottom: 0.5rem;">📋</div>
      <div style="font-weight: 600;">Audit Log</div>
    </a>
  </div>
</div>
{{template "foot" .}}
