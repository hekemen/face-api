{{template "head" .}}
<form method="POST" action="stream-check" enctype="multipart/form-data">
  <label for="rtsp_url">RTSP URL (optional):</label>
  <input type="text" id="rtsp_url" name="rtsp_url" placeholder="Leave empty to use default">
  <button type="submit">Check Stream</button>
</form>
{{if .Result}}
<div class="result {{.Class}}">{{.Result}}</div>
{{end}}
{{template "foot" .}}
