{{template "head" .}}
{{template "subpageHeader" .}}
<a href="./" class="back-link">← Dashboard</a>
<form method="POST" action="recognize" enctype="multipart/form-data" id="recognizeForm">
  <label for="image">Image:</label>
  <input type="file" id="image" name="image" accept="image/*" required>

  <details id="cameraSection" data-camera>
    <summary>Use webcam</summary>
    <div id="cameraStage" hidden>
      <video id="cameraVideo" muted playsinline autoplay></video>
      <canvas id="cameraCanvas"></canvas>
      <div>
        <button type="button" id="cameraCaptureBtn">Capture photo</button>
        <button type="button" class="secondary" id="cameraStopBtn">Stop camera</button>
      </div>
    </div>
    <button type="button" class="secondary" id="cameraBtn">Start camera</button>
  </details>

  <button type="submit">Recognize</button>
</form>
<div id="preview" class="preview-container" hidden>
  <img id="previewImg" src="" alt="Preview">
</div>
{{if .Result}}
<div class="result {{.Class}}">{{.Result}}</div>
{{end}}
{{template "camera" .}}
{{template "imagepreview" .}}
{{template "foot" .}}
{{template "clockScript" .}}
