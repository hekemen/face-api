{{template "head" .}}
{{template "subpageHeader" .}}
<a href="./" class="back-link">← Dashboard</a>

<div id="auditFilters" style="display:flex;flex-wrap:wrap;gap:0.5rem;margin-bottom:1rem;align-items:center;">
  <select id="filterUser" style="padding:0.4rem 0.6rem;min-width:140px;">
    <option value="">All users</option>
  </select>
  <select id="filterEndpoint" style="padding:0.4rem 0.6rem;">
    <option value="">All endpoints</option>
    <option value="enroll">enroll</option>
    <option value="recognize">recognize</option>
    <option value="stream-check">stream-check</option>
  </select>
  <select id="filterStatus" style="padding:0.4rem 0.6rem;">
    <option value="">All statuses</option>
    <option value="matched">Matched</option>
    <option value="not_matched">Not matched</option>
    <option value="no_face">No face</option>
  </select>
  <button id="clearFilters" style="padding:0.4rem 0.8rem;cursor:pointer;">Clear</button>
</div>

<!-- Promote bar: shown when an entry is selected -->
<div id="promoteBar" style="display:none;align-items:center;gap:0.5rem;padding:0.6rem 0.8rem;margin-bottom:0.75rem;background:var(--pico-card-background-color);border:1px solid var(--pico-muted-border-color);border-radius:4px;">
  <img id="promoteThumb" src="" class="face-thumb" style="width:48px;height:48px;flex-shrink:0;" />
  <input type="text" id="promoteName" placeholder="Enter name…" style="flex:1;padding:0.4rem;font-size:0.9rem;" />
  <button id="promoteBtn" style="padding:0.4rem 0.8rem;cursor:pointer;">Promote</button>
  <button id="deselectBtn" style="padding:0.4rem 0.6rem;cursor:pointer;background:transparent;border:1px solid var(--pico-muted-border-color);">✕</button>
  <span id="promoteStatus" style="font-size:0.85rem;"></span>
</div>

<p id="auditInfo">Loading...</p>

<div id="auditContent"></div>

<nav id="pagination" style="display:flex;justify-content:center;gap:0.25rem;margin:1rem 0;flex-wrap:wrap;"></nav>

<script>
(function() {
  'use strict';
  var state = { page: 1, perPage: 20, user: '', endpoint: '', status: '' };
  var selectedEntry = null;
  var usersLoaded = false;

  function buildURL() {
    var u = '../api/audit?page=' + state.page + '&per_page=' + state.perPage;
    if (state.user) u += '&name=' + encodeURIComponent(state.user);
    if (state.endpoint) u += '&endpoint=' + encodeURIComponent(state.endpoint);
    if (state.status) u += '&status=' + encodeURIComponent(state.status);
    return u;
  }

  function statusBadge(status) {
    switch (status) {
      case 'matched': return '<span class="badge badge-success">● Matched</span>';
      case 'not_matched': return '<span class="badge badge-warning">● Not matched</span>';
      case 'no_face': return '<span class="badge badge-danger">● No face</span>';
      default: return '';
    }
  }

  function renderEntry(entry) {
    var img = entry.face_image
      ? '<img src="data:image/jpeg;base64,' + entry.face_image + '" class="face-thumb entry-thumb" data-id="' + (entry.candidate_id || entry.time) + '">'
      : '<div class="face-thumb entry-thumb" data-id="' + (entry.candidate_id || entry.time) + '" style="display:flex;align-items:center;justify-content:center;background:var(--pico-card-background-color);color:var(--pico-muted-color);font-size:0.7rem;">—</div>';
    var name = entry.name || '<em style="color:var(--pico-muted-color);">—</em>';
    var similarity = entry.similarity != null ? entry.similarity.toFixed(3) : '—';
    var selectedClass = (selectedEntry && (selectedEntry.candidate_id || selectedEntry.time) === (entry.candidate_id || entry.time)) ? ' selected-entry' : '';
    return '<div class="entry' + selectedClass + '" style="display:flex;gap:0.75rem;align-items:center;padding:0.5rem 0;border-bottom:1px solid var(--pico-muted-border-color);">' +
      img +
      '<div style="flex:1;min-width:0;">' +
        '<div style="font-weight:600;">' + name + '</div>' +
        '<div class="entry-time">' + entry.time + '</div>' +
      '</div>' +
      '<div style="text-align:right;min-width:100px;">' +
        statusBadge(entry.status) +
        '<div style="font-size:0.8rem;color:var(--pico-muted-color);">similarity: ' + similarity + '</div>' +
      '</div>' +
    '</div>';
  }

  function selectEntry(entry) {
    selectedEntry = entry;
    var bar = document.getElementById('promoteBar');
    bar.style.display = 'flex';
    document.getElementById('promoteThumb').src = 'data:image/jpeg;base64,' + (entry.face_image || '');
    document.getElementById('promoteName').value = '';
    document.getElementById('promoteStatus').textContent = '';
    document.getElementById('promoteBtn').textContent = 'Promote';
    document.getElementById('promoteBtn').disabled = false;
    document.getElementById('promoteName').focus();
    render();
  }

  function deselectEntry() {
    selectedEntry = null;
    document.getElementById('promoteBar').style.display = 'none';
    render();
  }

  function doPromote() {
    if (!selectedEntry) return;
    var name = document.getElementById('promoteName').value.trim();
    if (!name) {
      document.getElementById('promoteName').focus();
      return;
    }
    var candidateId = selectedEntry.candidate_id || selectedEntry.time;
    var btn = document.getElementById('promoteBtn');
    btn.disabled = true;
    btn.textContent = 'Promoting…';
    document.getElementById('promoteStatus').textContent = '';

    fetch('../candidates/promote?id=' + encodeURIComponent(candidateId) + '&name=' + encodeURIComponent(name), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' }
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      document.getElementById('promoteStatus').innerHTML = '<span style="color:green;">✓ Promoted!</span>';
      setTimeout(function() {
        deselectEntry();
        render();
      }, 800);
    })
    .catch(function(err) {
      document.getElementById('promoteStatus').innerHTML = '<span style="color:red;">Error: ' + err + '</span>';
      btn.disabled = false;
      btn.textContent = 'Promote';
    });
  }

  function render() {
    fetch(buildURL())
      .then(function(r) { return r.json(); })
      .then(function(data) {
        document.getElementById('auditInfo').textContent =
          'Showing ' + data.entries.length + ' of ' + data.total_count + ' entries (page ' + data.page + '/' + data.total_pages + ')';

        var content = document.getElementById('auditContent');
        if (data.entries.length === 0) {
          content.innerHTML = '<p style="color:var(--pico-muted-color);">No entries found.</p>';
        } else {
          content.innerHTML = data.entries.map(renderEntry).join('');
        }

        // Bind click handlers for entry thumbnails
        content.querySelectorAll('.entry-thumb').forEach(function(img) {
          img.addEventListener('click', function() {
            var id = this.getAttribute('data-id');
            var entry = data.entries.find(function(e) { return (e.candidate_id || e.time) === id; });
            if (entry) {
              if (selectedEntry && (selectedEntry.candidate_id || selectedEntry.time) === id) {
                deselectEntry();
              } else {
                selectEntry(entry);
              }
            }
          });
        });

        // Render pagination
        var pag = document.getElementById('pagination');
        pag.innerHTML = '';
        if (data.page > 1) {
          var prev = document.createElement('button');
          prev.className = 'page-btn';
          prev.textContent = '← Prev';
          prev.addEventListener('click', function() { state.page--; render(); });
          pag.appendChild(prev);
        }
        var pBtn = document.createElement('span');
        pBtn.className = 'page-btn active';
        pBtn.textContent = data.page;
        pag.appendChild(pBtn);
        if (data.page < data.total_pages) {
          var next = document.createElement('button');
          next.className = 'page-btn';
          next.textContent = 'Next →';
          next.addEventListener('click', function() { state.page++; render(); });
          pag.appendChild(next);
        }
      })
      .catch(function(err) {
        document.getElementById('auditInfo').textContent = 'Error loading audit: ' + err;
      });
  }

  // Load users into filter dropdown
  function loadUsers() {
    if (usersLoaded) return;
    usersLoaded = true;
    fetch('../api/audit?per_page=1')
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var names = new Set();
        data.entries.forEach(function(e) { if (e.name) names.add(e.name); });
        var sel = document.getElementById('filterUser');
        Array.from(names).sort().forEach(function(n) {
          var opt = document.createElement('option');
          opt.value = n;
          opt.textContent = n;
          sel.appendChild(opt);
        });
      })
      .catch(function() {});
  }

  // Bind filters
  document.getElementById('filterUser').addEventListener('change', function() {
    state.user = this.value; state.page = 1; render();
  });
  document.getElementById('filterEndpoint').addEventListener('change', function() {
    state.endpoint = this.value; state.page = 1; render();
  });
  document.getElementById('filterStatus').addEventListener('change', function() {
    state.status = this.value; state.page = 1; render();
  });
  document.getElementById('clearFilters').addEventListener('click', function() {
    state = { page: 1, perPage: 20, user: '', endpoint: '', status: '' };
    document.getElementById('filterUser').value = '';
    document.getElementById('filterEndpoint').value = '';
    document.getElementById('filterStatus').value = '';
    render();
  });

  // Promote bar events
  document.getElementById('promoteBtn').addEventListener('click', doPromote);
  document.getElementById('deselectBtn').addEventListener('click', deselectEntry);
  document.getElementById('promoteName').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doPromote();
  });

  // Escape key deselects
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && selectedEntry) deselectEntry();
  });

  render();
  loadUsers();
})();
</script>
<style>
.badge { display: inline-block; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; font-weight: 600; }
.badge-success { background: #d4edda; color: #155724; }
.badge-warning { background: #fff3cd; color: #856404; }
.badge-danger { background: #f8d7da; color: #721c24; }
.entry { display: flex; gap: 0.75rem; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--pico-muted-border-color); }
.entry.selected-entry { background: rgba(0,0,0,0.03); border-radius: 4px; padding: 0.5rem; margin: 0 -0.5rem; }
.entry-thumb { cursor: pointer; transition: opacity 0.15s; }
.entry-thumb:hover { opacity: 0.75; }
</style>
{{template "foot" .}}
{{template "clockScript" .}}
